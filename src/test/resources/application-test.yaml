spring:
  datasource:
    url: "jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;"
    username: test
    password: test
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    enabled: false
  jpa:
    show-sql: true
    generate-ddl: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: 'create-drop'
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
    properties:
      hibernate:
        format_sql: true
  docker:
    compose:
      enabled: false