spring:
  application:
    name: retail_manager
  main:
    banner-mode: "off"
    allow-bean-definition-overriding: false
    cloud-platform: none
    allow-circular-references: false
    lazy-initialization: false
    log-startup-info: false
  security:
    jwt:
      key: "${JWT_KEY:development_random_jwt_signing_key_123}"
      ttl: "${JWT_TTL:30}"
  docker:
    compose:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      jedis:
        pool:
          enabled: true
          max-active: 4
          min-idle: 1
  datasource:
    url: "jdbc:h2:file:./target/db/H2DB.db;DATABASE_TO_UPPER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;"
    username: dev
    password: dev
    hikari:
      allow-pool-suspension: false
      maximum-pool-size: 5
  flyway:
    enabled: true
    table: production_flyway_migrations
    output-query-results: true
    out-of-order: false
    locations:
      - classpath:db/migration
    execute-in-transaction: true
    validate-on-migrate: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
    database-platform: org.hibernate.dialect.H2Dialect