spring:
  application:
    name: retail_manager
  main:
    banner-mode: "off"
    allow-bean-definition-overriding: false
    cloud-platform: none
    allow-circular-references: false
    lazy-initialization: false
    log-startup-info: false
  security:
    jwt:
      key: "${JWT_KEY:development_random_jwt_signing_key_123}"
      ttl: "${JWT_TTL:30}"
  docker:
    compose:
      enabled: false
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6363}"
      jedis:
        pool:
          enabled: true
          max-active: 4
          min-idle: 1
      password: "${REIDS_PASSWORD:session_db}"
  datasource:
    url: "jdbc:h2:file:./target/db/H2DB.db;DATABASE_TO_UPPER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;"
    username: "${DB_USERNAME:dev}"
    password: "${DB_PASSWORD:dev}"
    hikari:
      allow-pool-suspension: false
      maximum-pool-size: 5
  flyway:
    enabled: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
    database-platform: org.hibernate.dialect.H2Dialect