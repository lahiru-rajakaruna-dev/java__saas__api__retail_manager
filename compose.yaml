services:
  postgres:
    image: 'postgres:latest'
    environment:
      POSTGRES_DB: ${DB_NAME-retail_manager_dev_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD-retail_manager_dev_pass}
      POSTGRES_USER: ${DB_USERNAME-retail_manager_dev}
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-retail_manager_dev} -d ${DB_NAME:-retail_manger_main}" ]
      interval: 5s
      timeout: 3s
      retries: 2
  redis:
    depends_on:
      postgres:
        required: true
        condition: service_started
    image: 'redislabs/redis:latest'
    ports:
      - '6379:6379'
  app:
    depends_on:
      redis:
        required: true
        condition: service_started
      postgres:
        condition: service_healthy
        required: true
    image: ${APP_IMAGE-retail_manager:latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-dev}
      DB: ${DB_NAME-retail_manager_dev_db}
      DB_HOST: ${DB_HOST-postgres}
      DB_PASSWORD: ${DB_PASSWORD-retail_manager_dev_pass}
      DB_USERNAME: ${DB_USERNAME-retail_manager_dev}
      REDIS_HOST: ${REDIS_HOST-redis}
      REDIS_PORT: ${REDIS_PORT-6369}
    ports:
      - '8080:8080'