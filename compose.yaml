services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=retail_manager_main'
      - 'POSTGRES_PASSWORD=retail_manager_main_db_123'
      - 'POSTGRES_USER=retail_manager'
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U retail_manager -d retail_manger_main" ]
      interval: 5s
      timeout: 3s
      retries: 2
  redis:
    depends_on:
      - postgres
    image: 'redislabs/redis:latest'
    ports:
      - '6379:6363'
  app:
    depends_on:
      - redis
      - postgres
    image: 'retail_manager:1.0.1'
    environment:
      - 'SPRING_PROFILES_ACTIVE=stage'
      - 'DB=retail_manager_main'
      - 'DB_PASSWORD=retail_manager_main_db_123'
      - 'DB_USERNAME=retail_manager'
      - 'REDIS_HOST=redis'
      - 'REDIS_PORT=6363'
    ports:
      - '8080:8080'