name: build-local-image
run-name: BUILD ON NEW OK COMMIT
on:
  workflow_run:
    workflows: [ "test-on-push-to-main" ]
    types:
      - completed

env:
  container_registry: ghcr.io
  container_registry_username: ${{ github.actor }}
  container_registry_password: ${{ secrets.GITHUB_TOKEN }}
  repo_name: ${{ github.repository }}
  token: ${{ secrets.GITHUB_TOKEN }}
  image_name: retail_manager_api

jobs:
  build_and_push_to_gcr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build and Push Image to Github
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          java-package: 'jdk'
          distribution: "temurin"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Name
        id: image_name_generator
        run: |
          REPO_NAME_LOWERCASE=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=$(echo "${{ env.container_registry }}/${REPO_NAME_LOWERCASE}/${{ env.image_name }}")
          echo "image_tag_base=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: "docker build \
              -t ${{ steps.image_name_generator.outputs.image_tag_base }}/${{ env.image_name }}:build-${{ github.run_number }} \
               -t  ${{ steps.image_name_generator.outputs.image_tag_base }}/${{ env.image_name }}:sha-${{ github.sha }} \
               -t ${{ steps.image_name_generator.outputs.image_tag_base }}/${{ env.image_name }}:latest .
        "

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.container_registry }}
          username: ${{ env.container_registry_username }}
          password: ${{ env.container_registry_password }}

      - name: Push Image Registry
        run: "docker push --all-tags ${{ steps.image_name_generator.outputs.image_tag_base}}/${{ env.image_name }}"