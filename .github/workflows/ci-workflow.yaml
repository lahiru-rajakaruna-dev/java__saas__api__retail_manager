name: CI WORKFLOW
run-name: CI_WORKFLOW

on:
  pull_request:
    types:
      - opened
      - reopened
    branches:
      - production

jobs:
  pipeline:
    name: Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Compile
        run: ./mvnw clean verify
